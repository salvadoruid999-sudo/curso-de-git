<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clase Práctica - Carrito y Validación</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Gestor de Productos y Carrito de Compras</h2>
    <div class="container">
        <!-- Formulario -->
        <div class="card">
            <h3>Agregar Producto</h3>
                <form id="productForm">
                <label for="prodName">Nombre del Producto:</label>
                <input type="text" id="prodName" placeholder="Ej. Camisa casual">
                <span id="nameError" class="error"></span>

                <label for="prodPrice">Precio ($):</label>
                <input type="number" id="prodPrice" placeholder="Ej. 19.99"
step="0.01">
                <span id="priceError" class="error"></span>

                <button type="submit">Añadir al Carrito</button>
            </form>
        </div>

        <!-- Carrito -->
        <div class="card">
            <h3 id="cartTitle">Carrito de Compras</h3> <!-- Añadido el ID aquí -->
            <ul id="cartList">
                <li>El carrito está vacío</li>
            </ul>
            <div class="total-section">
                <strong>Total: $<span id="cartTotal">0.00</span></strong>
            </div>
        </div>
    </div>
    
</body>
</html>
