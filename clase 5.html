<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Primera Página</title>
</head>
<body>
    <h1>Registro de Estudiante</h1>
    <h2>Preferencias de Estudio</h2>
    <p>Por favor completa los siguientes datos para registrar tu asistencia .</p>

    <form>
    <label>Nombre completo :</label><br>
    <input type="text" placeholder="Ej. Ana Pérez">
    <br><br>

    <label>Correo electrónico :</label><br>
    <input type="email" placeholder="correo@universidad.edu">
    <br><br>

    <label>Edad :</label><br>
    <input type="number" min="1" max="100">
    <br><br>

    <label>Color favorito:</label><br>
    <input type="color">
    <br><br>

    <button type="submit">Registrar Datos</button>
    <button type="reset">Borrar formulario </button>
    </form>
</body>
</html>
